<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>SECTOR B - ONLINE STRIKE</title>
    <style>
        /* كود الـ CSS بتاعك بدون تغيير */
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #ui { position: absolute; top: 15px; left: 15px; color: #00f2ff; z-index: 10; pointer-events: none; }
        .stat { background: rgba(0,0,0,0.8); padding: 10px; border: 1px solid #00f2ff; margin-bottom: 5px; border-radius: 5px; }
        #battery-bar { width: 100px; height: 10px; background: #222; border: 1px solid #00f2ff; display: inline-block; }
        #battery-fill { width: 100%; height: 100%; background: #00f2ff; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: red; font-size: 30px; display: none; pointer-events: none; }
        #puzzle-ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); border: 2px solid #00f2ff; padding: 25px; color: #fff; text-align: center; display: none; z-index: 100; border-radius: 15px; width: 320px; }
        input { background: #111; border: 1px solid #00f2ff; color: #fff; padding: 10px; width: 80%; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="stat">المسافة: <span id="dist">0</span>/1500m</div>
        <div class="stat">البطارية: <div id="battery-bar"><div id="battery-fill"></div></div></div>
        <div class="stat" id="status">السلاح: مقفول | الكشاف: [1]</div>
    </div>

    <div id="crosshair">·</div>

    <div id="puzzle-ui">
        <h3 id="p-cat">سؤال</h3>
        <p id="p-ques">؟</p>
        <input type="text" id="p-ans">
        <br>
        <button onclick="checkAnswer()" style="margin-top:10px; padding:10px; background:#00f2ff; border:none; cursor:pointer;">فتح البوابة</button>
    </div>

    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } } </script>

    <script type="module">
        import * as THREE from 'three';
        // إضافة Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://warzone-game-e6eb8-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const myID = "Elite_" + Math.floor(Math.random() * 999);
        const playersRef = ref(db, 'sectorB/players');

        let scene, camera, renderer, player, flashLight, portal, weapon;
        let move = { w:0, s:0, a:0, d:0 }, isLocked = false, isPaused = false;
        let battery = 100, flashOn = false, slot = 1;
        let otherPlayers = {};
        const bullets = [];

        const questions = [
            {c: "كورة", q: "من هو الهداف التاريخي لدوري أبطال أوروبا؟", a: "رونالدو"},
            {c: "تاريخ", q: "ما هي عاصمة الدولة الإسلامية الأولى؟", a: "المدينة المنورة"},
            {c: "ماث", q: "كم ربعاً في العدد 2؟", a: "8"},
            {c: "فزورة", q: "شيء كلما زاد نقص؟", a: "العمر"}
        ];

        init();

        function createFunnyCharacter() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshStandardMaterial({color: 0x00ff00}));
            body.position.y = 0.3;
            const eyeGeo = new THREE.SphereGeometry(0.1);
            const eyeMat = new THREE.MeshBasicMaterial({color: 0xffffff});
            const eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(0.15, 0.4, -0.31);
            const eyeR = new THREE.Mesh(eyeGeo, eyeMat); eyeR.position.set(-0.15, 0.4, -0.31);
            group.add(body, eyeL, eyeR);
            return group;
        }

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({antialias: true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.01));

            const mat = new THREE.MeshStandardMaterial({color: 0x111111});
            const floor = new THREE.Mesh(new THREE.BoxGeometry(10, 0.2, 3000), mat); scene.add(floor);
            const wL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 10, 3000), mat); wL.position.set(-5, 5, 0); scene.add(wL);
            const wR = new THREE.Mesh(new THREE.BoxGeometry(0.2, 10, 3000), mat); wR.position.set(5, 5, 0); scene.add(wR);

            player = new THREE.Group();
            player.add(createFunnyCharacter());
            player.position.set(0, 0, 5);
            scene.add(player);
            player.add(camera);
            camera.position.set(0, 1.6, 0);

            flashLight = new THREE.SpotLight(0xffffff, 0, 80, 0.4, 0.5);
            flashLight.position.set(0, 1.5, 0);
            player.add(flashLight);
            player.add(flashLight.target);
            flashLight.target.position.set(0, 1.5, -10);

            weapon = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 0.6), new THREE.MeshStandardMaterial({color: 0x222222}));
            weapon.position.set(0.3, 1.3, -0.5);
            weapon.visible = false;
            player.add(weapon);

            portal = new THREE.Mesh(new THREE.TorusGeometry(3, 0.1), new THREE.MeshBasicMaterial({color: 0x00f2ff}));
            portal.position.set(0, 3, -100);
            scene.add(portal);

            // --- أونلاين: استقبال اللاعبين ---
            onValue(playersRef, (snap) => {
                const data = snap.val();
                for(let id in data) {
                    if(id !== myID) {
                        if(!otherPlayers[id]) {
                            otherPlayers[id] = createFunnyCharacter();
                            scene.add(otherPlayers[id]);
                        }
                        otherPlayers[id].position.set(data[id].x, data[id].y, data[id].z);
                        otherPlayers[id].rotation.y = data[id].ry;
                    }
                }
            });
            onDisconnect(ref(db, `sectorB/players/${myID}`)).remove();

            window.addEventListener('keydown', (e) => {
                if(e.key === '1') { slot = 1; weapon.visible = false; document.getElementById('crosshair').style.display = 'none'; }
                if(e.key === '2') { slot = 2; weapon.visible = true; document.getElementById('crosshair').style.display = 'block'; }
                if(e.key.toLowerCase() === 'f' && battery > 0) { flashOn = !flashOn; flashLight.intensity = flashOn ? 1000 : 0; }
                if(move.hasOwnProperty(e.key.toLowerCase())) move[e.key.toLowerCase()] = 1;
            });

            window.addEventListener('keyup', e => { if(move.hasOwnProperty(e.key.toLowerCase())) move[e.key.toLowerCase()] = 0; });

            document.body.onclick = () => {
                if(!isLocked) document.body.requestPointerLock();
                else if(slot === 2 && !isPaused) shoot();
            };

            document.addEventListener('pointerlockchange', () => { isLocked = document.pointerLockElement === document.body; });
            document.addEventListener('mousemove', (e) => {
                if(isLocked && !isPaused) {
                    player.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-1, Math.min(1, camera.rotation.x));
                }
            });

            newQuestion();
            animate();
        }

        function shoot() {
            const b = new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshBasicMaterial({color: 0xff0000}));
            b.position.copy(player.position);
            b.position.y += 1.4;
            const dir = new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);
            b.userData.velocity = dir.multiplyScalar(1.5);
            scene.add(b);
            bullets.push(b);
        }

        function newQuestion() {
            const q = questions[Math.floor(Math.random() * questions.length)];
            document.getElementById('p-cat').innerText = q.c;
            document.getElementById('p-ques').innerText = q.q;
            window.currentAns = q.a;
        }

        window.checkAnswer = () => {
            if(document.getElementById('p-ans').value.includes(window.currentAns)) {
                portal.position.z -= 250;
                isPaused = false;
                document.getElementById('puzzle-ui').style.display = 'none';
                document.getElementById('p-ans').value = "";
                document.body.requestPointerLock();
                newQuestion();
            }
        };

        function animate() {
            requestAnimationFrame(animate);
            if(isLocked && !isPaused) {
                const speed = 0.3;
                const fwd = new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);
                const side = new THREE.Vector3(1,0,0).applyQuaternion(player.quaternion);
                if(move.w) player.position.addScaledVector(fwd, speed);
                if(move.s) player.position.addScaledVector(fwd, -speed);
                if(move.a) player.position.addScaledVector(side, -speed);
                if(move.d) player.position.addScaledVector(side, speed);

                player.position.x = Math.max(-4.5, Math.min(4.5, player.position.x));

                // تحديث بياناتك للأونلاين
                set(ref(db, `sectorB/players/${myID}`), {
                    x: player.position.x, y: player.position.y, z: player.position.z,
                    ry: player.rotation.y
                });

                document.getElementById('dist').innerText = Math.abs(Math.floor(player.position.z));

                if(flashOn) {
                    battery -= 0.04;
                    document.getElementById('battery-fill').style.width = battery + "%";
                    if(battery <= 0) { battery=0; flashOn=false; flashLight.intensity=0; }
                }

                if(player.position.distanceTo(portal.position) < 4) {
                    isPaused = true; document.exitPointerLock();
                    document.getElementById('puzzle-ui').style.display = 'block';
                }
            }

            bullets.forEach((b, index) => {
                b.position.add(b.userData.velocity);
                if(b.position.distanceTo(player.position) > 100) {
                    scene.remove(b);
                    bullets.splice(index, 1);
                }
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
