<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="utf-8">
    <title>WAR ZONE - ADVANCED SETTINGS</title>
    <style>
        body {
            margin: 0; padding: 0; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: #050505; font-family: 'Segoe UI', sans-serif; color: white;
            overflow: hidden;
        }

        .settings-card {
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid #0ff;
            width: 450px; padding: 30px;
            border-radius: 10px; box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            position: relative; z-index: 10;
        }

        h1 { color: #0ff; text-transform: uppercase; letter-spacing: 3px; font-size: 22px; margin-bottom: 25px; text-align: center; }

        .setting-item {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding: 10px; background: rgba(255,255,255,0.03);
            border-radius: 5px;
        }

        label { font-size: 13px; color: #aaa; text-transform: uppercase; }

        /* Full Screen Button Special Style */
        .fs-btn {
            background: rgba(0, 255, 255, 0.1); border: 1px solid #0ff;
            color: #0ff; padding: 8px 15px; cursor: pointer; font-size: 12px;
            transition: 0.3s; text-transform: uppercase;
        }
        .fs-btn:hover { background: #0ff; color: #000; }

        input[type="range"] { cursor: pointer; accent-color: #0ff; }

        .btn-group { display: flex; gap: 10px; margin-top: 30px; }
        button { flex: 1; padding: 12px; cursor: pointer; font-weight: bold; text-transform: uppercase; border: none; }
        .save { background: #0ff; color: #000; }
        .back { background: #222; color: #fff; }

        #status-msg {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            color: #0ff; font-size: 12px; display: none;
        }
    </style>
</head>
<body>

    <div class="settings-card">
        <h1>System Config</h1>

        <div class="setting-item">
            <label>Display Mode</label>
            <button class="fs-btn" onclick="toggleFullScreen()">Toggle Full Screen</button>
        </div>

        <div class="setting-item">
            <label>Audio Volume</label>
            <input type="range" id="vol" min="0" max="1" step="0.1" value="0.8">
        </div>

        <div class="setting-item">
            <label>Mouse Sensitivity</label>
            <input type="range" id="sens" min="0.001" max="0.01" step="0.001" value="0.002">
        </div>

        <div class="setting-item">
            <label>Post Processing</label>
            <input type="checkbox" id="bloom" checked style="accent-color:#0ff; width:20px; height:20px;">
        </div>

        <div class="btn-group">
            <button class="back" onclick="location.href='lobby.html'">Exit</button>
            <button class="save" onclick="applySettings()">Apply & Save</button>
        </div>

        <div id="status-msg">SETTINGS UPDATED_</div>
    </div>

    <script>
        // 1. وظيفة الـ Full Screen
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Error: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // 2. حفظ الإعدادات وتطبيقها
        function applySettings() {
            const settings = {
                vol: document.getElementById('vol').value,
                sens: document.getElementById('sens').value,
                bloom: document.getElementById('bloom').checked
            };

            // حفظ في الذاكرة
            localStorage.setItem('game_settings', JSON.stringify(settings));

            // إظهار رسالة نجاح
            const msg = document.getElementById('status-msg');
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 2000);
        }

        // 3. تحميل الإعدادات عند فتح الصفحة
        window.onload = function() {
            const saved = JSON.parse(localStorage.getItem('game_settings'));
            if(saved) {
                document.getElementById('vol').value = saved.vol;
                document.getElementById('sens').value = saved.sens;
                document.getElementById('bloom').checked = saved.bloom;
            }
        }
    </script>
</body>
</html>
