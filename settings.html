<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات اللعبة - THE ESCAPE</title>
    <style>
        :root {
            --primary: #ff00ff;
            --bg: #0a0a0a;
            --panel: #1a1a1a;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: white;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .settings-container {
            background: var(--panel);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid var(--primary);
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.2);
            width: 350px;
            text-align: center;
        }

        h1 {
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
            margin-bottom: 30px;
            letter-spacing: 5px;
        }

        .setting-item {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }

        label {
            font-weight: bold;
            font-size: 14px;
            color: #ccc;
        }

        /* تنسيق الـ Range (الصوت والحساسية) */
        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* تنسيق الأزرار */
        .btn {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 12px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background: var(--primary);
            color: black;
            box-shadow: 0 0 15px var(--primary);
        }

        .btn-save {
            background: var(--primary);
            color: black;
            margin-top: 20px;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 12px;
        }

        .back-link:hover { color: white; }
    </style>
</head>
<body>

    <div class="settings-container">
        <h1>SETTINGS</h1>

        <div class="setting-item">
            <label>مستوى الصوت (Volume): <span id="vol-val">50%</span></label>
            <input type="range" id="volume" min="0" max="1" step="0.1" value="0.5">
        </div>

        <div class="setting-item">
            <label>حساسية الماوس (Sensitivity): <span id="sens-val">2.0</span></label>
            <input type="range" id="sensitivity" min="0.5" max="10" step="0.5" value="2">
        </div>

        <div class="setting-item">
            <label>جودة الجرافيك:</label>
            <select id="graphics" style="width:100%; padding:8px; background:#333; color:white; border:none;">
                <option value="low">منخفضة (Low)</option>
                <option value="medium" selected>متوسطة (Medium)</option>
                <option value="high">عالية (High)</option>
            </select>
        </div>

        <button class="btn" id="fs-btn">تبديل وضع الشاشة الكاملة</button>
        <button class="btn btn-save" id="save-btn">حفظ الإعدادات</button>

        <a href="index.html" class="back-link">العودة للعبة ←</a>
    </div>

    <script>
        // العناصر من الـ DOM
        const volInput = document.getElementById('volume');
        const sensInput = document.getElementById('sensitivity');
        const graphicsInput = document.getElementById('graphics');
        const volText = document.getElementById('vol-val');
        const sensText = document.getElementById('sens-val');

        // 1. تحميل الإعدادات المحفوظة عند فتح الصفحة
        window.onload = () => {
            const savedSettings = JSON.parse(localStorage.getItem('gameSettings'));
            if (savedSettings) {
                volInput.value = savedSettings.volume;
                sensInput.value = savedSettings.sensitivity;
                graphicsInput.value = savedSettings.graphics;
                updateDisplay();
            }
        };

        // تحديث الأرقام المعروضة بجانب الـ Sliders
        function updateDisplay() {
            volText.innerText = Math.round(volInput.value * 100) + "%";
            sensText.innerText = sensInput.value;
        }

        volInput.oninput = updateDisplay;
        sensInput.oninput = updateDisplay;

        // 2. زر الحفظ (Save)
        document.getElementById('save-btn').onclick = () => {
            const settings = {
                volume: volInput.value,
                sensitivity: sensInput.value,
                graphics: graphicsInput.value
            };
            
            // حفظ في ذاكرة المتصفح
            localStorage.setItem('gameSettings', JSON.stringify(settings));
            alert("تم حفظ الإعدادات بنجاح!");
        };

        // 3. وضع الشاشة الكاملة
        document.getElementById('fs-btn').onclick = () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        };
    </script>
</body>
</html>
