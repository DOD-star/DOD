<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>THE FARM - CUSTOM EDITION</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma; }
        #hud { position: absolute; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
        #money-display { position: absolute; top: 20px; left: 20px; color: #2ecc71; font-size: 26px; font-weight: bold; background: rgba(0,0,0,0.85); padding: 15px; border-radius: 12px; border: 2px solid #2ecc71; }
        #time-ui { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #f1c40f; font-size: 22px; background: rgba(0,0,0,0.9); padding: 10px 30px; border-radius: 50px; border: 2px solid #f1c40f; }
        
        #pc-browser { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 700px; height: 500px; background: #050505; border: 4px solid #8b0000; display: none; z-index: 2000; pointer-events: auto; color: white; border-radius: 20px; overflow: hidden; flex-direction: column; }
        .browser-header { background: #8b0000; padding: 15px; text-align: center; font-weight: bold; }
        .seed-list { flex: 1; overflow-y: auto; padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .seed-card { background: #151515; border: 1px solid #333; padding: 15px; border-radius: 10px; text-align: center; }
        .buy-btn { background: #2ecc71; border: none; cursor: pointer; padding: 8px 20px; font-weight: bold; border-radius: 5px; margin-top: 10px; }
        
        #interact-hint { position: absolute; bottom: 120px; width: 100%; text-align: center; color: white; font-size: 24px; font-weight: bold; display: none; }
        #sleep-overlay { position: absolute; width: 100%; height: 100%; background: black; opacity: 0; pointer-events: none; transition: opacity 1.2s; z-index: 3000; }
    </style>
</head>
<body>

    <div id="sleep-overlay"></div>
    <div id="hud">
        <div id="money-display">💰 $<span id="balance">100000</span></div>
        <div id="time-ui">🕒 <span id="clock">06:00</span></div>
        <div id="interact-hint">إضغط [E] للتفاعل</div>
    </div>

    <div id="pc-browser">
        <div class="browser-header">سوق البذور المظلم</div>
        <div id="seed-container" class="seed-list"></div>
        <button onclick="closePC()" style="background:#222; color:white; border:none; padding:15px; cursor:pointer;">إغلاق</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, player, clock = new THREE.Clock();
        let keys = {}, totalSeconds = 21600, balance = 100000;
        let velY = 0, isJumping = false, inWater = false;
        let interactable = null, isUsingPC = false;
        let beds = [], pcs = [], houseWalls = [], nameLabels = [];

        // بذور المتجر (20 نوع)
        const seeds = Array.from({length: 20}, (_, i) => ({
            n: `بذرة مستوى ${i+1}`,
            p: Math.floor(Math.pow(i+1, 4.5) * 50 + 100)
        }));
        seeds[19] = {n: "بذرة الثراء الفاحش", p: 2000000};

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020205);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1500);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.3));
            const sun = new THREE.DirectionalLight(0xffffff, 0.7);
            sun.position.set(50, 100, 50);
            scene.add(sun);

            player = new THREE.Group();
            player.add(camera);
            camera.position.y = 1.7;
            player.position.set(0, 0, 150);
            scene.add(player);

            const ground = new THREE.Mesh(new THREE.RingGeometry(40, 800, 64), new THREE.MeshStandardMaterial({ color: 0x0a140a }));
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            createLake();

            for (let i = 0; i < 6; i++) {
                let angle = (i / 6) * Math.PI * 2;
                createFarm(Math.cos(angle)*120, Math.sin(angle)*120, angle);
            }

            fillBrowser();
            setupControls();
            animate();
        }

        function createLake() {
            const water = new THREE.Mesh(new THREE.CylinderGeometry(40, 40, 13, 32), new THREE.MeshStandardMaterial({ color: 0x002244, transparent: true, opacity: 0.7 }));
            water.position.y = -6.5; scene.add(water);
        }

        function createEmptyLabel() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 512; canvas.height = 128;
            ctx.fillStyle = 'rgba(255,255,255,0.1)'; // يافطة شبه شفافة فاضية
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(8, 2, 1);
            return sprite;
        }

        function createFarm(x, z, angle) {
            const farm = new THREE.Group();
            farm.position.set(x, 0, z);
            farm.rotation.y = angle + Math.PI/2 - Math.PI/8;

            const label = createEmptyLabel();
            label.position.set(0, 11, 0); 
            farm.add(label);
            nameLabels.push(label);

            const field = new THREE.Mesh(new THREE.PlaneGeometry(18, 25), new THREE.MeshStandardMaterial({color: 0x1d140d}));
            field.rotation.x = -Math.PI/2; field.position.set(0, 0.02, 18);
            farm.add(field);

            const house = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x3d281a });
            
            const wallSpecs = [
                {w:12, h:8, d:0.6, x:0, y:4, z:-6}, // back
                {w:0.6, h:8, d:12, x:-6, y:4, z:0}, // left
                {w:0.6, h:8, d:12, x:6, y:4, z:0},  // right
                {w:4.5, h:8, d:0.6, x:-3.75, y:4, z:6}, 
                {w:4.5, h:8, d:0.6, x:3.75, y:4, z:6},  
                {w:3, h:2.5, d:0.6, x:0, y:6.75, z:6}    
            ];

            wallSpecs.forEach(s => {
                const w = new THREE.Mesh(new THREE.BoxGeometry(s.w, s.h, s.d), mat);
                w.position.set(s.x, s.y, s.z);
                house.add(w); houseWalls.push(w);
            });

            const roof = new THREE.Mesh(new THREE.BoxGeometry(13, 0.5, 13), mat);
            roof.position.y = 8; house.add(roof);

            // تصغير السرير (Bed)
            const bed = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.5, 4.5), new THREE.MeshStandardMaterial({color: 0x555555}));
            bed.position.set(-4, 0.25, -3); 
            house.add(bed); beds.push(bed);

            const pc = new THREE.Mesh(new THREE.BoxGeometry(2, 1.2, 0.1), new THREE.MeshBasicMaterial({color: 0x00f2ff}));
            pc.position.set(4, 3.5, -5.7); house.add(pc); pcs.push(pc);

            farm.add(house);
            scene.add(farm);
        }

        function fillBrowser() {
            const container = document.getElementById('seed-container');
            seeds.forEach(s => {
                container.innerHTML += `<div class="seed-card"><b>${s.n}</b><div style="color:#2ecc71">$${s.p.toLocaleString()}</div><button class="buy-btn" onclick="buySeed(${s.p})">شراء</button></div>`;
            });
        }

        function setupControls() {
            window.addEventListener('keydown', e => {
                keys[e.code] = true;
                if(e.code === 'KeyE') handleInteraction();
                if(e.code === 'Space' && !isJumping) { velY = 0.25; isJumping = true; }
            });
            window.addEventListener('keyup', e => keys[e.code] = false);
            document.body.onclick = () => { if(!isUsingPC) document.body.requestPointerLock(); };
            document.addEventListener('mousemove', e => {
                if(document.pointerLockElement) player.rotation.y -= e.movementX * 0.002;
            });
        }

        function handleInteraction() {
            if(interactable === 'bed') {
                document.getElementById('sleep-overlay').style.opacity = 1;
                setTimeout(() => { totalSeconds = 21600; document.getElementById('sleep-overlay').style.opacity = 0; }, 1200);
            } else if(interactable === 'pc') {
                isUsingPC = true;
                document.getElementById('pc-browser').style.display = 'flex';
                document.exitPointerLock();
            }
        }

        window.buySeed = (p) => { if(balance >= p) { balance -= p; document.getElementById('balance').innerText = balance.toLocaleString(); } };
        window.closePC = () => { isUsingPC = false; document.getElementById('pc-browser').style.display = 'none'; document.body.requestPointerLock(); };

        function animate() {
            requestAnimationFrame(animate);
            totalSeconds += 10;
            let h = Math.floor(totalSeconds / 3600) % 24;
            document.getElementById('clock').innerText = h.toString().padStart(2,'0') + ":00";

            nameLabels.forEach(label => label.quaternion.copy(camera.quaternion));

            if(!isUsingPC) {
                let speed = 0.5, oldPos = player.position.clone();
                if(keys['KeyW']) player.translateZ(-speed); if(keys['KeyS']) player.translateZ(speed);
                if(keys['KeyA']) player.translateX(-speed); if(keys['KeyD']) player.translateX(speed);

                houseWalls.forEach(wall => {
                    if(new THREE.Box3().setFromObject(wall).containsPoint(player.position)) player.position.copy(oldPos);
                });

                if(player.position.length() < 40) {
                    if(player.position.y > -11.5) velY -= 0.01; else { velY = 0; player.position.y = -11.5; isJumping = false; }
                } else {
                    if(player.position.y > 0) velY -= 0.01; else { velY = 0; player.position.y = 0; isJumping = false; }
                }
                player.position.y += velY;

                interactable = null;
                document.getElementById('interact-hint').style.display = 'none';
                beds.forEach(b => { if(player.position.distanceTo(b.getWorldPosition(new THREE.Vector3())) < 4) interactable = 'bed'; });
                pcs.forEach(p => { if(player.position.distanceTo(p.getWorldPosition(new THREE.Vector3())) < 4) interactable = 'pc'; });
                if(interactable) document.getElementById('interact-hint').style.display = 'block';
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
