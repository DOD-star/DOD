<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="utf-8">
    <title>WAR ZONE - PLAYER IDENTITY</title>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            background: url('background.gif') no-repeat center center fixed; 
            background-size: cover;
            font-family: 'Segoe UI', sans-serif; color: white;
        }
        body::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: -1;
        }

        .profile-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 700px; background: rgba(10, 10, 10, 0.9);
            border: 1px solid #0ff; box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            display: flex; padding: 40px; border-radius: 20px; gap: 30px;
            background-image: linear-gradient(135deg, rgba(0,255,255,0.05) 25%, transparent 25%);
            background-size: 40px 40px;
        }

        /* الجانب الأيسر: الصورة والـ ID */
        .profile-left { text-align: center; border-right: 1px solid #333; padding-right: 30px; }
        #p_img_big { width: 180px; height: 180px; border: 3px solid #0ff; border-radius: 15px; object-fit: cover; box-shadow: 0 0 20px #0ff; margin-bottom: 15px; }
        .player-id { background: #0ff; color: #000; padding: 5px 10px; font-weight: bold; font-size: 12px; border-radius: 3px; letter-spacing: 2px; }

        /* الجانب الأيمن: البيانات */
        .profile-right { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .info-group { margin-bottom: 20px; }
        .label { color: #0ff; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; display: block; margin-bottom: 5px; }
        .value { font-size: 24px; font-weight: bold; letter-spacing: 1px; color: #fff; text-shadow: 0 0 5px rgba(255,255,255,0.3); }

        /* إحصائيات سريعة */
        .stats-row { display: flex; gap: 20px; margin-top: 20px; border-top: 1px solid #333; padding-top: 20px; }
        .stat-card { text-align: center; flex: 1; }
        .stat-val { display: block; font-size: 20px; font-weight: bold; color: #0ff; }
        .stat-lbl { font-size: 9px; color: #888; text-transform: uppercase; }

        .back-btn {
            position: absolute; bottom: 20px; right: 20px;
            padding: 10px 30px; background: transparent; border: 1px solid #fff;
            color: #fff; cursor: pointer; font-weight: bold; text-transform: uppercase;
            transition: 0.3s;
        }
        .back-btn:hover { background: #fff; color: #000; }

        /* تأثير الحركة */
        .scan-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: rgba(0, 255, 255, 0.5); box-shadow: 0 0 10px #0ff;
            animation: scan 4s linear infinite;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
    </style>
</head>
<body>

    <div class="profile-container">
        <div class="scan-line"></div>
        
        <div class="profile-left">
            <img id="p_img_big" src="" alt="PLAYER PHOTO">
            <div class="player-id" id="p_id_display">ID: ERROR-00</div>
        </div>

        <div class="profile-right">
            <div class="info-group">
                <span class="label">Callsign / Nickname</span>
                <span class="value" id="p_nick_big">UNKNOWN</span>
            </div>

            <div class="info-group">
                <span class="label">Real Name</span>
                <span class="value" id="p_name_big">UNREGISTERED</span>
            </div>

            <div class="info-group">
                <span class="label">Region / Country</span>
                <span class="value" id="p_country_big">GLOBAL</span>
            </div>

            <div class="stats-row">
                <div class="stat-card">
                    <span class="stat-val">0</span>
                    <span class="stat-lbl">Matches</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val">0.0</span>
                    <span class="stat-lbl">K/D Ratio</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val">Lv. 1</span>
                    <span class="stat-lbl">Rank</span>
                </div>
            </div>
        </div>

        <button class="back-btn" onclick="location.href='lobby.html'">Exit Profile</button>
    </div>

    <script>
        window.onload = function() {
            // سحب البيانات من الذاكرة
            const nick = localStorage.getItem('p_nick');
            const name = localStorage.getItem('p_name');
            const country = localStorage.getItem('p_country');
            const img = localStorage.getItem('p_img');

            if(nick) {
                document.getElementById('p_nick_big').innerText = nick;
                document.getElementById('p_name_big').innerText = name;
                document.getElementById('p_country_big').innerText = country;
                document.getElementById('p_img_big').src = img;

                // توليد ID عشوائي لو مش موجود
                if(!localStorage.getItem('user_id')) {
                    const randomID = "WZ-" + Math.floor(100000 + Math.random() * 900000);
                    localStorage.setItem('user_id', randomID);
                }
                document.getElementById('p_id_display').innerText = "ID: " + localStorage.getItem('user_id');
            }
        };
    </script>
</body>
</html>
