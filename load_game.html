<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="utf-8">
    <title>WAR ZONE - DATA RECOVERY</title>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            background: url('background.gif') no-repeat center center fixed; 
            background-size: cover;
            font-family: 'Segoe UI', sans-serif; color: white;
        }
        body::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); z-index: -1;
        }

        .load-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 600px; padding: 30px;
        }

        h2 { text-align: center; color: #0ff; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 40px; text-shadow: 0 0 10px #0ff; }

        .slot {
            background: rgba(20, 20, 20, 0.8); border: 1px solid #333;
            margin-bottom: 20px; padding: 20px; border-radius: 5px;
            display: flex; justify-content: space-between; align-items: center;
            transition: 0.3s; cursor: pointer; position: relative;
            overflow: hidden;
        }

        /* خانة نشطة (فيها داتا) */
        .slot.active { border-left: 5px solid #0ff; background: rgba(0, 255, 255, 0.05); }
        .slot.active:hover { background: rgba(0, 255, 255, 0.1); box-shadow: 0 0 20px rgba(0, 255, 255, 0.2); }

        /* خانة فاضية */
        .slot.empty { opacity: 0.6; border-style: dashed; }
        .slot.empty:hover { opacity: 1; border-color: #555; }

        .slot-info h3 { margin: 0; font-size: 18px; letter-spacing: 1px; color: #0ff; }
        .slot-info p { margin: 5px 0 0; font-size: 12px; color: #888; }

        .load-btn {
            background: #0ff; color: #000; border: none; padding: 8px 20px;
            font-weight: bold; text-transform: uppercase; cursor: pointer;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }

        .empty-text { font-style: italic; color: #444; }

        .back-btn {
            display: block; width: 120px; margin: 30px auto 0; padding: 10px;
            background: transparent; border: 1px solid #fff; color: #fff;
            text-align: center; text-decoration: none; font-size: 12px;
            transition: 0.3s; cursor: pointer;
        }
        .back-btn:hover { background: #fff; color: #000; }

        /* تأثير النبض للخانة النشطة */
        .active-pulse {
            position: absolute; right: 10px; top: 10px;
            width: 8px; height: 8px; background: #0ff;
            border-radius: 50%; box-shadow: 0 0 10px #0ff;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div class="load-container">
        <h2>Restore Session</h2>

        <div id="main-slot" class="slot empty">
            <div class="slot-info">
                <h3 id="slot-name">Empty Slot</h3>
                <p id="slot-meta">No data found in this sector.</p>
            </div>
            <div id="slot-action">
                <span class="empty-text">Empty</span>
            </div>
        </div>

        <div class="slot empty">
            <div class="slot-info">
                <h3>Cloud Backup</h3>
                <p>Connection lost... Unable to sync.</p>
            </div>
            <div class="empty-text">Locked</div>
        </div>

        <div class="slot empty">
            <div class="slot-info">
                <h3>Legacy Save</h3>
                <p>Data corrupted or missing.</p>
            </div>
            <div class="empty-text">Locked</div>
        </div>

        <button class="back-btn" onclick="location.href='lobby.html'">Cancel</button>
    </div>

    <script>
        window.onload = function() {
            // بنشيك لو فيه لاعب متسجل
            const nick = localStorage.getItem('p_nick');
            const country = localStorage.getItem('p_country');
            
            if(nick) {
                const mainSlot = document.getElementById('main-slot');
                const slotName = document.getElementById('slot-name');
                const slotMeta = document.getElementById('slot-meta');
                const slotAction = document.getElementById('slot-action');

                // تحويل الخانة لـ نشطة
                mainSlot.classList.remove('empty');
                mainSlot.classList.add('active');
                
                // عرض بيانات اللاعب الحقيقية
                slotName.innerText = "OPERATOR: " + nick;
                slotMeta.innerText = "Location: " + country + " | Status: In Lobby";
                
                // إضافة زرار الـ Load ونقطة النبض
                slotAction.innerHTML = `
                    <div class="active-pulse"></div>
                    <button class="load-btn" onclick="location.href='lobby.html'">Resume</button>
                `;
            }
        };
    </script>
</body>
</html>
