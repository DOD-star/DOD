<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>THE ESCAPE - CROSS PLATFORM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; user-select: none; touch-action: none; }
        #ui { position: absolute; top: 10px; left: 10px; color: #ff00ff; z-index: 100; pointer-events: none; }
        .stat { background: rgba(0,0,0,0.8); padding: 8px; border: 1px solid #ff00ff; margin-bottom: 5px; border-radius: 5px; font-size: 12px; }
        #bat-bar { width: 80px; height: 8px; background: #222; border: 1px solid #ff00ff; display: inline-block; }
        #bat-fill { width: 100%; height: 100%; background: #0f0; }
        
        /* أزرار الموبايل */
        #mobile-controls { position: absolute; bottom: 30px; right: 30px; display: none; gap: 20px; z-index: 1000; }
        .m-btn { width: 65px; height: 65px; background: rgba(255,0,255,0.2); border: 2px solid #ff00ff; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; pointer-events: auto; }
        #joy-container { position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border-radius: 50%; display: none; z-index: 1000; }
        #stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: #ff00ff; border-radius: 50%; opacity: 0.5; }

        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ff00ff; font-size: 20px; z-index: 100; pointer-events: none; }
        #keypad-ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #000; border: 2px solid #ff00ff; padding: 15px; display: none; flex-direction: column; align-items: center; z-index: 5000; border-radius: 10px; }
        .grid { display: grid; grid-template-columns: repeat(3, 45px); gap: 5px; }
        .k { width: 45px; height: 45px; background: #111; color: #ff00ff; border: 1px solid #444; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        #fade { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; opacity: 0; pointer-events: none; transition: opacity 1s; z-index: 9999; }
    </style>
</head>
<body>

    <div id="fade"></div>
    <div id="ui">
        <div class="stat">BAT: <div id="bat-bar"><div id="bat-fill"></div></div></div>
        <div class="stat" id="mode-text">SEARCH FOR PEN</div>
    </div>

    <div id="crosshair">+</div>

    <div id="joy-container"><div id="stick"></div></div>
    <div id="mobile-controls">
        <div class="m-btn" id="btn-f">F</div>
        <div class="m-btn" id="btn-e">E</div>
    </div>

    <div id="keypad-ui">
        <div id="key-display" style="color:#0f0; font-size: 1.5rem; margin-bottom:10px;">---</div>
        <div class="grid">
            <div class="k" onclick="pk('1')">1</div><div class="k" onclick="pk('2')">2</div><div class="k" onclick="pk('3')">3</div>
            <div class="k" onclick="pk('4')">4</div><div class="k" onclick="pk('5')">5</div><div class="k" onclick="pk('6')">6</div>
            <div class="k" onclick="pk('7')">7</div><div class="k" onclick="pk('8')">8</div><div class="k" onclick="pk('9')">9</div>
            <div class="k" style="grid-column: span 3; width:100%;" onclick="pk('C')">CLR</div>
        </div>
        <button onclick="toggleKey(false)" style="margin-top:10px; background:#400; color:white; border:none; padding:5px 10px;">CLOSE</button>
    </div>

    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } } </script>

    <script type="module">
        import * as THREE from 'three';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://warzone-game-e6eb8-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        update(ref(db, 'sectorB'), { doorState: "closed" });

        let scene, camera, renderer, player, playerBody, flashLight, door, penDevice, keypadBtn;
        let move = {w:0, s:0, a:0, d:0}, isLocked = false, isPaused = false;
        let hasPen = false, battery = 100, flashOn = false, code = "";
        const solids = [];

        // Mobile vars
        let isMobile = /Android|iPhone/i.test(navigator.userAgent);
        let joyActive = false, joyOrigin = {x:0, y:0};

        if(isMobile) {
            document.getElementById('mobile-controls').style.display = 'flex';
            document.getElementById('joy-container').style.display = 'block';
        }

        init();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({antialias: true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.01));

            // Floor & Walls
            const floor = new THREE.Mesh(new THREE.BoxGeometry(40, 0.2, 40), new THREE.MeshStandardMaterial({color: 0x050505}));
            scene.add(floor);

            const wallMat = new THREE.MeshStandardMaterial({color: 0x111111});
            const cw = (w, h, d, x, y, z) => {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
                wall.position.set(x, y, z); scene.add(wall); solids.push(wall);
            };
            cw(40, 10, 1, 0, 5, -20); cw(1, 10, 40, -20, 5, 0); cw(1, 10, 40, 20, 5, 0);
            cw(17, 10, 1, -11.5, 5, 20); cw(17, 10, 1, 11.5, 5, 20);

            door = new THREE.Mesh(new THREE.BoxGeometry(6, 10, 0.5), new THREE.MeshStandardMaterial({color: 0x330033}));
            door.position.set(0, 5, 20); scene.add(door); solids.push(door);

            keypadBtn = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.2), new THREE.MeshStandardMaterial({color: 0x00ff00}));
            keypadBtn.position.set(4, 1.5, 19.5); scene.add(keypadBtn);

            // Secret Code Box
            const box = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({color: 0x151515}));
            box.position.set(10, 1, -10); scene.add(box); solids.push(box);
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width=128; canvas.height=128;
            ctx.font="bold 60px Arial"; ctx.fillStyle="#ff00ff"; ctx.fillText("741", 20, 80);
            box.material = new THREE.MeshStandardMaterial({map: new THREE.CanvasTexture(canvas), emissive: 0xff00ff, emissiveIntensity: 0});
            box.userData.isSecret = true;

            // Pen
            penDevice = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.5), new THREE.MeshStandardMaterial({color: 0xff00ff, emissive: 0xff00ff}));
            penDevice.position.set(-15, 0.25, -15); scene.add(penDevice);

            // Player
            player = new THREE.Group();
            scene.add(player);
            playerBody = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 0.6), new THREE.MeshStandardMaterial({color: 0x00ccff}));
            playerBody.position.y = 1; player.add(playerBody);
            player.add(camera); camera.position.set(0, 1.8, 0);

            flashLight = new THREE.SpotLight(0xffffff, 0, 20, 0.5);
            player.add(flashLight); player.add(flashLight.target);
            flashLight.target.position.set(0, 1.8, -5);

            // Input handling (PC)
            if(!isMobile) {
                document.body.addEventListener('click', () => { if(!isPaused) document.body.requestPointerLock(); });
                document.addEventListener('pointerlockchange', () => { isLocked = document.pointerLockElement === document.body; });
                document.addEventListener('mousemove', (e) => {
                    if(isLocked && !isPaused) {
                        player.rotation.y -= e.movementX * 0.002;
                        camera.rotation.x -= e.movementY * 0.002;
                        camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
                    }
                });
            }

            // Input handling (Mobile)
            window.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                if(touch.clientX < window.innerWidth/2) {
                    joyActive = true; joyOrigin = {x: touch.clientX, y: touch.clientY};
                }
            }, {passive: false});

            window.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                if(joyActive && touch.clientX < window.innerWidth/2) {
                    const dx = touch.clientX - joyOrigin.x;
                    const dy = touch.clientY - joyOrigin.y;
                    const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 40);
                    const angle = Math.atan2(dy, dx);
                    document.getElementById('stick').style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
                    move.w = dy < -10 ? 1 : 0; move.s = dy > 10 ? 1 : 0;
                    move.a = dx < -10 ? 1 : 0; move.d = dx > 10 ? 1 : 0;
                } else if(touch.clientX > window.innerWidth/2) {
                    // Camera Rotation for Mobile
                    player.rotation.y -= (touch.clientX - (window.lastX || touch.clientX)) * 0.005;
                    window.lastX = touch.clientX;
                }
            }, {passive: false});

            window.addEventListener('touchend', () => { joyActive = false; move = {w:0, s:0, a:0, d:0}; document.getElementById('stick').style.transform = 'none'; window.lastX = null; });

            // Keyboard
            window.addEventListener('keydown', e => { 
                const k = e.key.toLowerCase(); if(move.hasOwnProperty(k)) move[k]=1; 
                if(k==='f') toggleFlash(); if(k==='e') interact();
            });
            window.addEventListener('keyup', e => { if(move.hasOwnProperty(e.key.toLowerCase())) move[e.key.toLowerCase()]=0; });

            // Mobile Buttons
            document.getElementById('btn-f').addEventListener('touchstart', toggleFlash);
            document.getElementById('btn-e').addEventListener('touchstart', interact);

            window.pk = (n) => {
                if(n === 'C') code = ""; else if(code.length < 3) code += n;
                document.getElementById('key-display').innerText = code.padEnd(3, '-');
                if(code === "741") { update(ref(db, 'sectorB'), {doorState: "open"}); toggleKey(false); }
            };

            onValue(ref(db, 'sectorB/doorState'), (snap) => {
                if(snap.val() === "open") { 
                    const lift = () => { if(door.position.y < 14) { door.position.y += 0.1; requestAnimationFrame(lift); } }; lift(); 
                    setTimeout(() => { let idx = solids.indexOf(door); if(idx>-1) solids.splice(idx, 1); }, 500);
                }
            });

            animate();
        }

        function toggleFlash() {
            if(battery <= 0) return;
            flashOn = !flashOn; 
            flashLight.intensity = flashOn ? (hasPen ? 35 : 15) : 0;
        }

        function interact() {
            if(player.position.distanceTo(penDevice.position) < 3.5 && !hasPen) {
                hasPen = true; scene.remove(penDevice);
                flashLight.color.set(0xff00ff);
                document.getElementById('mode-text').innerText = "UV MODE ACTIVE";
            }
            if(player.position.distanceTo(keypadBtn.position) < 3) toggleKey(true);
        }

        window.toggleKey = (s) => { 
            isPaused = s; 
            document.getElementById('keypad-ui').style.display = s?'flex':'none'; 
            if(s && !isMobile) document.exitPointerLock(); 
        }

        function animate() {
            requestAnimationFrame(animate);
            if((isLocked || isMobile) && !isPaused) {
                const spd = 0.18;
                const f = new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);
                const s = new THREE.Vector3(1,0,0).applyQuaternion(player.quaternion);
                let np = player.position.clone();
                if(move.w) np.addScaledVector(f, spd); if(move.s) np.addScaledVector(f, -spd);
                if(move.a) np.addScaledVector(s, -spd); if(move.d) np.addScaledVector(s, spd);

                let collided = false;
                for(let obj of solids) {
                    const b = new THREE.Box3().setFromObject(obj);
                    const p = new THREE.Box3().setFromCenterAndSize(np, new THREE.Vector3(1.2, 2, 1.2));
                    if(b.intersectsBox(p)) { collided = true; break; }
                }
                if(!collided) player.position.copy(np);

                scene.traverse(obj => {
                    if(obj.userData.isSecret) {
                        const dist = player.position.distanceTo(obj.position);
                        obj.material.emissiveIntensity = (hasPen && flashOn && dist < 5) ? 5 : 0;
                    }
                });

                if(player.position.z > 22) {
                    document.getElementById('fade').style.opacity = 1;
                    setTimeout(() => window.location.href = 'sectorB.html', 1000);
                }

                if(flashOn) {
                    battery -= 0.05;
                    document.getElementById('bat-fill').style.width = battery + "%";
                    if(battery <= 0) { flashOn = false; flashLight.intensity = 0; }
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
