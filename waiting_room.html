<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="utf-8">
    <title>WAR ZONE - SQUAD LOBBY</title>
    <style>
        /* الستايل الأصلي بتاعك بدون أي تعديل */
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            background: #000 url('background.gif') no-repeat center fixed; 
            background-size: cover;
            font-family: 'Segoe UI', sans-serif; color: white;
        }
        body::before { 
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.9); z-index: -1; 
        }
        .header { text-align: center; padding: 30px; border-bottom: 1px solid rgba(0, 255, 255, 0.2); }
        .code-title { font-size: 14px; color: #888; letter-spacing: 3px; margin: 0; }
        .room-code { font-size: 45px; color: #0ff; font-weight: bold; letter-spacing: 8px; text-shadow: 0 0 15px #0ff; margin: 5px 0; }
        
        .squad-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 25px; width: 85%; margin: 40px auto; 
            justify-items: center; align-items: center;
        }

        .slot { 
            width: 100%; max-width: 220px; height: 280px; 
            background: rgba(20, 20, 20, 0.8); border: 1px solid #333; 
            border-radius: 12px; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; position: relative; 
            transition: 0.4s ease;
        }

        .occupied { border-color: #0ff; box-shadow: 0 0 20px rgba(0, 255, 255, 0.1); transform: translateY(-5px); }
        .ready-tag { 
            position: absolute; top: 15px; right: 15px; 
            background: #0ff; color: #000; font-size: 10px; 
            padding: 3px 10px; font-weight: bold; border-radius: 4px; display: none;
        }

        .player-img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #0ff; margin-bottom: 15px; object-fit: cover; }
        .player-name { font-size: 18px; font-weight: bold; color: #fff; margin: 0; }
        .player-role { font-size: 11px; color: #0ff; text-transform: uppercase; margin-top: 5px; opacity: 0.8; }

        .waiting { border-style: dashed; opacity: 0.4; }
        .loader { width: 30px; height: 30px; border: 3px solid #333; border-top-color: #0ff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .controls { position: fixed; bottom: 50px; width: 100%; text-align: center; display: flex; justify-content: center; gap: 20px; }
        .btn { 
            padding: 15px 50px; font-weight: bold; cursor: pointer; 
            text-transform: uppercase; border: none; 
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%); 
            transition: 0.3s; font-size: 16px;
        }
        .btn-ready { background: #ff0; color: #000; }
        .btn-start { background: #0ff; color: #000; display: none; }
        .btn-exit { background: #333; color: #fff; }
    </style>
</head>
<body>

    <div class="header">
        <p class="code-title">NETWORK ACCESS CODE</p>
        <div class="room-code" id="displayCode">WZ-XXX</div>
        <p id="roomInfo" style="color: #555; font-size: 12px;"></p>
    </div>

    <div class="squad-grid" id="mainGrid"></div>

    <div class="controls">
        <button class="btn btn-exit" onclick="leaveRoom()">LEAVE</button>
        <button class="btn btn-ready" id="readyBtn" onclick="setMyReady()">I'M READY</button>
        <button class="btn btn-start" id="startBtn" onclick="startMission()">START MISSION</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // --- تم ربط بياناتك بنجاح يسطا ---
        const firebaseConfig = {
            apiKey: "AIzaSyCnNBz-inBVtqfq9pbRZYK36rkySandTrU",
            authDomain: "warzone-game-e6eb8.firebaseapp.com",
            projectId: "warzone-game-e6eb8",
            storageBucket: "warzone-game-e6eb8.firebasestorage.app",
            messagingSenderId: "964151734409",
            appId: "1:964151734409:web:f3009af893508ecb2b1658",
            measurementId: "G-1G173HL329",
            databaseURL: "https://warzone-game-e6eb8-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const roomCode = localStorage.getItem('current_room_code') || "WZ-101";
        const maxPlayers = parseInt(localStorage.getItem('max_players') || 4);
        const myNick = localStorage.getItem('p_nick') || "YOU";
        const myImg = localStorage.getItem('p_img') || "https://api.dicebear.com/7.x/pixel-art/svg?seed=player";
        const myRole = localStorage.getItem('room_role') || "Member";

        const roomRef = ref(db, 'rooms/' + roomCode);
        const myPlayerRef = ref(db, `rooms/${roomCode}/players/${myNick}`);

        function renderLobby(playersData) {
            const grid = document.getElementById('mainGrid');
            grid.innerHTML = '';
            
            let playersList = playersData ? Object.values(playersData) : [];

            const isMeIn = playersList.find(p => p.nick === myNick);
            if (!isMeIn) {
                playersList.unshift({ nick: myNick, img: myImg, role: myRole, ready: false });
            }

            for (let i = 0; i < maxPlayers; i++) {
                const slot = document.createElement('div');
                const p = playersList[i];

                if (p) {
                    slot.className = 'slot occupied';
                    slot.innerHTML = `
                        <div class="ready-tag" style="display: ${p.ready ? 'block' : 'none'}">READY</div>
                        <img src="${p.img}" class="player-img">
                        <p class="player-name">${p.nick.toUpperCase()}</p>
                        <span class="player-role">${p.role === 'Host' ? 'SQUAD LEADER' : 'OPERATOR'}</span>
                    `;
                } else {
                    slot.className = 'slot waiting';
                    slot.innerHTML = `
                        <div class="loader"></div>
                        <p style="color:#555; margin-top:10px; font-size:12px;">SEARCHING...</p>
                    `;
                }
                grid.appendChild(slot);
            }

            if (myRole === 'Host') {
                const allReady = playersList.length > 0 && playersList.every(pl => pl.ready);
                document.getElementById('startBtn').style.display = allReady ? 'inline-block' : 'none';
            }
        }

        window.onload = () => {
            document.getElementById('displayCode').innerText = roomCode;
            document.getElementById('roomInfo').innerText = "MAX SQUAD: " + maxPlayers;
            renderLobby(null);
            set(myPlayerRef, { nick: myNick, img: myImg, role: myRole, ready: false });
            onDisconnect(myPlayerRef).remove();
        };

        onValue(roomRef, (snapshot) => {
            const data = snapshot.val();
            renderLobby(data ? data.players : null);
            if (data && data.status === 'started') {
                window.location.href = 'play.html';
            }
        });

        window.setMyReady = () => {
            update(myPlayerRef, { ready: true });
            document.getElementById('readyBtn').style.display = 'none';
        };

        window.startMission = () => {
            update(roomRef, { status: 'started' });
        };

        window.leaveRoom = () => {
            remove(myPlayerRef).then(() => { window.location.href = 'index.html'; });
        };
    </script>
</body>
</html>
