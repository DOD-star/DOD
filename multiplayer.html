<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="utf-8">
    <title>WAR ZONE - MULTIPLAYER</title>
    <style>
        body { 
            margin: 0; background: #000 url('background.gif') no-repeat center fixed; 
            background-size: cover; font-family: 'Segoe UI', sans-serif; color: white; overflow: hidden; 
        }
        body::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: -1; }
        
        /* الحاوية الرئيسية */
        .container { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 450px; display: flex; flex-direction: column; gap: 20px;
        }

        .modal { 
            background: rgba(10, 10, 10, 0.95); border: 1px solid #333; 
            padding: 30px; border-radius: 5px; position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            transition: 0.3s;
        }

        /* تمييز الـ Host بلون الـ Neon */
        .host-section { border-top: 4px solid #f0f; }
        .join-section { border-top: 4px solid #0ff; }

        h2 { text-align: center; margin-top: 0; letter-spacing: 2px; font-size: 18px; }
        label { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 5px; display: block; }

        .modal-input { 
            width: 100%; background: #1a1a1a; border: 1px solid #333; 
            color: #fff; padding: 12px; margin-bottom: 15px; outline: none; 
            box-sizing: border-box; font-weight: bold;
        }
        .modal-input:focus { border-color: inherit; }

        .btn { 
            width: 100%; padding: 15px; font-weight: bold; cursor: pointer; 
            text-transform: uppercase; border: none; transition: 0.3s; 
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%);
        }

        .btn-host { background: #f0f; color: #fff; }
        .btn-host:hover { background: #ff00ff; box-shadow: 0 0 15px rgba(255, 0, 255, 0.4); }

        .btn-join { background: #0ff; color: #000; }
        .btn-join:hover { background: #00ffff; box-shadow: 0 0 15px rgba(0, 255, 255, 0.4); }

        .divider { text-align: center; color: #444; font-size: 12px; position: relative; }
        .divider::before, .divider::after { content: "----------"; letter-spacing: -2px; margin: 0 10px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="modal host-section">
            <h2 style="color:#f0f;">HOST COMMAND CENTER</h2>
            <label>Max Squad Members:</label>
            <input type="number" id="maxPlayers" class="modal-input" value="4" min="2" max="10">
            
            <label>Visibility:</label>
            <select id="roomType" class="modal-input">
                <option value="public">Public Node (Visible)</option>
                <option value="private">Private Node (Encrypted)</option>
            </select>
            
            <button class="btn btn-host" onclick="initHost()">DEPLOY NEW LOBBY</button>
        </div>

        <div class="divider">OR</div>

        <div class="modal join-section">
            <h2 style="color:#0ff;">JOIN SQUAD</h2>
            <label>Access Code:</label>
            <input type="text" id="joinCode" class="modal-input" placeholder="WZ-XXX" style="text-align: center; letter-spacing: 5px;">
            
            <button class="btn btn-join" onclick="initJoin()">LINK TO NODE</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // الـ Config بتاعك يسطا (نفس اللي جبناه)
        const firebaseConfig = {
            apiKey: "AIzaSyCnNBz-inBVtqfq9pbRZYK36rkySandTrU",
            authDomain: "warzone-game-e6eb8.firebaseapp.com",
            projectId: "warzone-game-e6eb8",
            storageBucket: "warzone-game-e6eb8.firebasestorage.app",
            messagingSenderId: "964151734409",
            appId: "1:964151734409:web:f3009af893508ecb2b1658",
            databaseURL: "https://warzone-game-e6eb8-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // وظيفة الـ Host
        window.initHost = async () => {
            const max = document.getElementById('maxPlayers').value;
            const type = document.getElementById('roomType').value;
            const code = "WZ-" + Math.floor(100 + Math.random() * 899);

            // حفظ في السيرفر
            await set(ref(db, 'rooms/' + code), {
                settings: { maxPlayers: max, type: type },
                status: 'waiting'
            });

            // حفظ في المتصفح
            localStorage.setItem('current_room_code', code);
            localStorage.setItem('max_players', max);
            localStorage.setItem('room_role', 'Host');
            
            location.href = 'waiting_room.html';
        }

        // وظيفة الـ Join
        window.initJoin = async () => {
            const code = document.getElementById('joinCode').value.toUpperCase().trim();
            
            if(!code) return alert("Enter Squad Code!");

            // التأكد إن الروم موجودة في الفايربيس
            const roomSnapshot = await get(ref(db, 'rooms/' + code));
            
            if (roomSnapshot.exists()) {
                const roomData = roomSnapshot.val();
                
                localStorage.setItem('current_room_code', code);
                localStorage.setItem('max_players', roomData.settings.maxPlayers);
                localStorage.setItem('room_role', 'Member');
                
                location.href = 'waiting_room.html';
            } else {
                alert("NODE NOT FOUND: Check the code again.");
            }
        }
    </script>
</body>
</html>
